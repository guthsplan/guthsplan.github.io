<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyungu Kim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sora',sans-serif;background:#fefefe;color:#111;overflow-x:hidden;min-height:100vh}
#landing{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.aura{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:380px;height:380px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,120,120,.09),rgba(255,190,80,.07),rgba(255,230,100,.05),rgba(120,220,160,.07),rgba(100,190,255,.10),rgba(160,120,255,.07),rgba(255,130,210,.07),rgba(255,120,120,.09));
  filter:blur(55px);animation:ar 18s linear infinite,ap 6s ease-in-out infinite;pointer-events:none;z-index:1}
.aura2{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:270px;height:270px;border-radius:50%;
  background:conic-gradient(from 180deg,rgba(255,170,210,.05),rgba(120,210,255,.04),rgba(190,255,170,.04),rgba(255,230,120,.05),rgba(255,170,210,.05));
  filter:blur(38px);animation:ar 11s linear infinite reverse,ap 7s ease-in-out infinite;pointer-events:none;z-index:1}
@keyframes ar{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes ap{0%,100%{opacity:.5;scale:1}50%{opacity:1;scale:1.08}}

#agent-area{position:relative;width:min(90vw,760px);height:min(90vw,760px);z-index:2}
#main-agent{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:240px;height:290px;z-index:10;overflow:visible}

/* Baby: BEHIND text (z-index lower than nav labels) */
#baby{position:fixed;z-index:15;pointer-events:none;opacity:0;transition:opacity .8s}
#baby.show{opacity:1}
#baby svg{width:68px;height:82px;overflow:visible;transition:filter .3s}
#baby.glow svg{filter:drop-shadow(0 0 12px rgba(80,180,240,.45))}

.nav-label{position:absolute;cursor:pointer;z-index:20;transform:translate(-50%,-50%);
  font-family:'Sora',sans-serif;font-size:11px;font-weight:400;letter-spacing:2px;
  text-transform:uppercase;color:#111;opacity:.4;white-space:nowrap;
  transition:opacity .4s,transform .35s cubic-bezier(.25,.46,.45,.94)}
.nav-label:hover{opacity:1;transform:translate(-50%,-50%) scale(1.08)}

#sub{display:none;min-height:100vh;padding:70px 24px 90px;background:#fefefe}
#sub.active{display:block;animation:pf .4s}
@keyframes pf{from{opacity:0}to{opacity:1}}
.back{position:fixed;top:28px;left:28px;z-index:100;width:40px;height:40px;border-radius:12px;
  background:rgba(0,0,0,.04);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s}
.back:hover{background:rgba(0,0,0,.08)}
.back svg{width:16px;height:16px;stroke:#111;stroke-width:1.6;fill:none}
.ph{text-align:center;margin-bottom:56px;padding-top:16px}
.ph h2{font-family:'Playfair Display',serif;font-size:clamp(20px,4vw,32px);font-weight:400;font-style:italic}
.pc{max-width:720px;margin:0 auto}
.ec{padding:24px 0;border-bottom:1px solid #eee;opacity:0;animation:si .5s forwards}
.ec:last-child{border-bottom:none}
@keyframes si{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ec h3{font-family:'Playfair Display',serif;font-size:15px;font-weight:500;margin-bottom:4px}
.ec .ds{font-size:12px;color:#777;line-height:1.55;font-style:italic;margin-bottom:5px;padding:5px 10px;border-left:1.5px solid #eee}
.si2{padding:14px 0;border-bottom:1px solid #eee;opacity:0;animation:si .5s forwards}
.si2:last-child{border-bottom:none}
.si2 h3{font-family:'Playfair Display',serif;font-size:14px;font-weight:500;margin-bottom:2px}
.si2 p{font-size:12px;color:#777}
.as{margin-bottom:30px}
.as h3{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:3px;margin-bottom:12px;color:#999}
.as p,.as li{font-size:13.5px;line-height:1.85;color:#555}
.as ul{list-style:none;padding:0}
.as li{padding:3px 0 3px 14px;position:relative}
.as li::before{content:'\2014';position:absolute;left:0;color:#aaa}
.as a{color:#111;text-decoration:underline;text-decoration-color:#ddd;text-underline-offset:3px}
.xc{padding:20px 0;border-bottom:1px solid #eee;opacity:0;animation:si .5s forwards}
.xc:last-child{border-bottom:none}
.xc .xh{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px;margin-bottom:5px}
.xc .xh h3{font-family:'Playfair Display',serif;font-size:15px;font-weight:500}
.xc .xh span{font-size:10px;color:#999;letter-spacing:1px}
.xc p{font-size:12px;color:#777;line-height:1.6}
.xc a{color:#111;text-decoration:underline;text-decoration-color:#ddd;text-underline-offset:3px}
@media(max-width:600px){.nav-label{font-size:9px}#agent-area{width:96vw;height:96vw}#main-agent{width:180px;height:218px}#baby svg{width:50px;height:60px}}
</style>
</head>
<body>

<div id="landing">
  <div class="aura"></div><div class="aura2"></div>
  <div id="agent-area">
    <svg id="main-agent" viewBox="0 0 200 242" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="hG" cx="42%" cy="30%" r="58%">
          <stop offset="0%" stop-color="#fff"/><stop offset="50%" stop-color="#f4f5f8"/><stop offset="85%" stop-color="#e2e6ec"/><stop offset="100%" stop-color="#ced4de"/>
        </radialGradient>
        <radialGradient id="bG" cx="44%" cy="28%" r="60%">
          <stop offset="0%" stop-color="#fff"/><stop offset="45%" stop-color="#f2f4f7"/><stop offset="80%" stop-color="#dfe4ec"/><stop offset="100%" stop-color="#c8d0da"/>
        </radialGradient>
        <radialGradient id="aG" cx="40%" cy="28%" r="60%">
          <stop offset="0%" stop-color="#f8f9fb"/><stop offset="60%" stop-color="#eaeff3"/><stop offset="100%" stop-color="#d2d8e0"/>
        </radialGradient>
        <radialGradient id="vG" cx="50%" cy="35%" r="55%">
          <stop offset="0%" stop-color="#3a3e48"/><stop offset="40%" stop-color="#1a1e25"/><stop offset="100%" stop-color="#0a0c10"/>
        </radialGradient>
        <radialGradient id="eG" cx="50%" cy="45%" r="50%">
          <stop offset="0%" stop-color="#b0ecff"/><stop offset="35%" stop-color="#5ec5e5"/><stop offset="70%" stop-color="#2a95bb"/><stop offset="100%" stop-color="#1a6888"/>
        </radialGradient>
        <linearGradient id="vR" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(255,255,255,.16)"/><stop offset="45%" stop-color="rgba(255,255,255,.02)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </linearGradient>
        <radialGradient id="sH" cx="35%" cy="22%" r="35%">
          <stop offset="0%" stop-color="rgba(255,255,255,.8)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </radialGradient>
        <filter id="gl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>

      <!-- LEFT ARM: penguin flipper, longer, tilted outward -->
      <g id="m-la" style="transform-origin:72px 128px">
        <ellipse cx="38" cy="138" rx="16" ry="42" fill="url(#aG)" transform="rotate(28,38,138)"/>
        <ellipse cx="38" cy="138" rx="16" ry="42" fill="none" stroke="#c5ccd5" stroke-width=".3" transform="rotate(28,38,138)"/>
        <ellipse cx="33" cy="122" rx="6" ry="14" fill="url(#sH)" opacity=".4" transform="rotate(28,33,122)"/>
      </g>

      <!-- RIGHT ARM -->
      <g id="m-ra" style="transform-origin:128px 128px">
        <ellipse cx="162" cy="138" rx="16" ry="42" fill="url(#aG)" transform="rotate(-28,162,138)"/>
        <ellipse cx="162" cy="138" rx="16" ry="42" fill="none" stroke="#c5ccd5" stroke-width=".3" transform="rotate(-28,162,138)"/>
        <ellipse cx="167" cy="122" rx="6" ry="14" fill="url(#sH)" opacity=".4" transform="rotate(-28,167,122)"/>
      </g>

      <!-- BODY: egg, tapered bottom (smooth, not too sharp) -->
      <g id="m-bd" style="transform-origin:100px 168px">
        <!-- Concave notch at arm joints (subtle inward curves) -->
        <path d="M100,108 C130,108 152,130 154,160 C156,190 145,218 130,228 Q115,236 100,237 Q85,236 70,228 C55,218 44,190 46,160 C48,130 70,108 100,108Z" fill="url(#bG)"/>
        <path d="M100,108 C130,108 152,130 154,160 C156,190 145,218 130,228 Q115,236 100,237 Q85,236 70,228 C55,218 44,190 46,160 C48,130 70,108 100,108Z" fill="none" stroke="#c8cfd8" stroke-width=".3"/>
        <!-- Concave dips at arm attachment points -->
        <path d="M68,120 Q64,128 68,138" fill="none" stroke="rgba(190,198,210,.3)" stroke-width="1.5"/>
        <path d="M132,120 Q136,128 132,138" fill="none" stroke="rgba(190,198,210,.3)" stroke-width="1.5"/>
        <!-- Body specular -->
        <ellipse cx="86" cy="138" rx="20" ry="26" fill="url(#sH)" opacity=".45"/>
        <!-- "9" embossed -->
        <text x="100" y="188" text-anchor="middle" font-family="'Sora',sans-serif" font-size="26" font-weight="500" fill="rgba(195,203,215,.45)">9</text>
        <!-- Neck concave notch -->
        <path d="M82,110 Q100,114 118,110" fill="none" stroke="rgba(190,198,210,.25)" stroke-width="1.2"/>
      </g>

      <!-- HEAD: wider, flatter (wider rx, smaller ry = 바둑 shape) -->
      <g id="m-hd" style="transform-origin:100px 60px">
        <ellipse cx="100" cy="58" rx="56" ry="44" fill="url(#hG)"/>
        <ellipse cx="100" cy="58" rx="56" ry="44" fill="none" stroke="#c8cfd8" stroke-width=".3"/>
        <!-- Big specular highlight -->
        <ellipse cx="85" cy="32" rx="26" ry="14" fill="white" opacity=".45" transform="rotate(-8,85,32)"/>
        <ellipse cx="83" cy="28" rx="12" ry="7" fill="white" opacity=".25" transform="rotate(-8,83,28)"/>

        <!-- VISOR: rounder (closer to circle than the head) -->
        <ellipse cx="100" cy="61" rx="44" ry="33" fill="url(#vG)"/>
        <ellipse cx="100" cy="61" rx="44" ry="33" fill="none" stroke="rgba(60,70,80,.2)" stroke-width=".4"/>
        <!-- Visor gloss -->
        <ellipse cx="90" cy="44" rx="28" ry="12" fill="url(#vR)" transform="rotate(-5,90,44)"/>

        <!-- EYES: concentric circles only (blue ring + black pupil), clean -->
        <g id="m-eyes">
          <g id="m-eL">
            <circle cx="80" cy="62" r="15" fill="url(#eG)" filter="url(#gl)"/>
            <circle id="m-pL" cx="80" cy="62" r="6" fill="#0a0e14"/>
          </g>
          <g id="m-eR">
            <circle cx="120" cy="62" r="15" fill="url(#eG)" filter="url(#gl)"/>
            <circle id="m-pR" cx="120" cy="62" r="6" fill="#0a0e14"/>
          </g>
        </g>

        <!-- Visor rim -->
        <ellipse cx="100" cy="61" rx="45" ry="34" fill="none" stroke="rgba(200,210,220,.12)" stroke-width="1.2"/>
      </g>
    </svg>
  </div>
</div>

<!-- BABY: same SVG structure, behind text -->
<div id="baby">
  <svg viewBox="0 0 200 242" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
    <!-- Reuse same defs from main (they're in same document) -->
    <g id="b-la" style="transform-origin:72px 128px">
      <ellipse cx="38" cy="138" rx="16" ry="42" fill="url(#aG)" transform="rotate(28,38,138)"/>
      <ellipse cx="33" cy="122" rx="6" ry="14" fill="url(#sH)" opacity=".4" transform="rotate(28,33,122)"/>
    </g>
    <g id="b-ra" style="transform-origin:128px 128px">
      <ellipse cx="162" cy="138" rx="16" ry="42" fill="url(#aG)" transform="rotate(-28,162,138)"/>
      <ellipse cx="167" cy="122" rx="6" ry="14" fill="url(#sH)" opacity=".4" transform="rotate(-28,167,122)"/>
    </g>
    <g id="b-bd" style="transform-origin:100px 168px">
      <path d="M100,108 C130,108 152,130 154,160 C156,190 145,218 130,228 Q115,236 100,237 Q85,236 70,228 C55,218 44,190 46,160 C48,130 70,108 100,108Z" fill="url(#bG)"/>
      <path d="M68,120 Q64,128 68,138" fill="none" stroke="rgba(190,198,210,.3)" stroke-width="1.5"/>
      <path d="M132,120 Q136,128 132,138" fill="none" stroke="rgba(190,198,210,.3)" stroke-width="1.5"/>
      <text x="100" y="188" text-anchor="middle" font-family="'Sora',sans-serif" font-size="26" font-weight="500" fill="rgba(195,203,215,.45)">9</text>
    </g>
    <g id="b-hd" style="transform-origin:100px 60px">
      <ellipse cx="100" cy="58" rx="56" ry="44" fill="url(#hG)"/>
      <ellipse cx="85" cy="32" rx="26" ry="14" fill="white" opacity=".45" transform="rotate(-8,85,32)"/>
      <ellipse cx="100" cy="61" rx="44" ry="33" fill="url(#vG)"/>
      <ellipse cx="90" cy="44" rx="28" ry="12" fill="url(#vR)" transform="rotate(-5,90,44)"/>
      <g id="b-eyes">
        <circle cx="80" cy="62" r="15" fill="url(#eG)" filter="url(#gl)"/>
        <circle id="b-pL" cx="80" cy="62" r="6" fill="#0a0e14"/>
        <circle cx="120" cy="62" r="15" fill="url(#eG)" filter="url(#gl)"/>
        <circle id="b-pR" cx="120" cy="62" r="6" fill="#0a0e14"/>
      </g>
      <ellipse cx="100" cy="61" rx="45" ry="34" fill="none" stroke="rgba(200,210,220,.12)" stroke-width="1.2"/>
    </g>
  </svg>
</div>

<div id="sub">
  <div class="back" onclick="goBack()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div>
  <div class="ph"><h2 id="pt"></h2></div>
  <div class="pc" id="pc"></div>
</div>

<script>
const N=[{id:'about',label:'About'},{id:'opensource',label:'Open Source'},{id:'publications',label:'Publications'},{id:'sideprojects',label:'Projects'},{id:'honors',label:'Honors'},{id:'misc',label:'Misc'},{id:'research',label:'Research'}];
const P={
  about:{t:'About',r:()=>`<div class="as"><h3>Bio</h3><p>Hi! I'm <strong>Hyungu Kim</strong>.</p></div><div class="as"><h3>Links</h3><ul><li><a href="https://github.com/guthsplan" target="_blank">GitHub</a></li></ul></div>`},
  opensource:{t:'Open Source',r:()=>`<div class="ec"><h3>Coming soon</h3><p class="ds">Projects will be listed here.</p></div>`},
  publications:{t:'Publications',r:()=>`<p style="font-size:11px;color:#999">Papers will be listed here.</p>`},
  sideprojects:{t:'Projects',r:()=>`<div class="ec"><h3>Coming soon</h3><p class="ds">Side projects here.</p></div>`},
  honors:{t:'Honors',r:()=>`<div class="si2"><h3>Coming soon</h3><p>Awards here.</p></div>`},
  misc:{t:'Misc',r:()=>`<div class="si2"><h3>Coming soon</h3><p>Misc here.</p></div>`},
  research:{t:'Research',r:()=>`<div class="xc"><div class="xh"><h3>Coming soon</h3></div><p>Research here.</p></div>`}
};

const AA=document.getElementById('agent-area');
function placeLabels(){
  document.querySelectorAll('.nav-label').forEach(e=>e.remove());
  const cx=AA.offsetWidth/2,cy=AA.offsetHeight/2,r=Math.min(cx,cy)*.85;
  N.forEach((n,i)=>{
    const a=(220-i*(360/N.length))*Math.PI/180;
    const x=cx+r*Math.cos(a),y=cy-r*Math.sin(a);
    const el=document.createElement('div');
    el.className='nav-label';el.textContent=n.label;
    el.style.left=x+'px';el.style.top=y+'px';
    el.addEventListener('click',()=>{
      // Baby glow on click
      baby.classList.add('glow');
      setTimeout(()=>baby.classList.remove('glow'),400);
      setTimeout(()=>openPage(n.id),200);
    });
    AA.appendChild(el);
  });
}

let mx=innerWidth/2,my=innerHeight/2,lastMove=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;lastMove=performance.now()});

// Main agent
const ms=document.getElementById('main-agent');
const mHd=document.getElementById('m-hd'),mBd=document.getElementById('m-bd');
const mLa=document.getElementById('m-la'),mRa=document.getElementById('m-ra');
const mPL=document.getElementById('m-pL'),mPR=document.getElementById('m-pR');
let mhR=0,mbR=0,mlR=0,mrR=0;

function tickMain(){
  const t=performance.now()/1000;
  ms.style.transform=`translate(-50%,-50%) translateY(${Math.sin(t*.9)*7}px)`;
  const r=ms.getBoundingClientRect();
  const ax=r.left+r.width/2,ay=r.top+r.height/2;
  const dx=mx-ax,dy=my-ay,dist=Math.sqrt(dx*dx+dy*dy)||1,md=500;

  // Pupils (concentric black circle moves within blue)
  const px=(dx/dist)*Math.min(4,dist/md*4);
  const py=(dy/dist)*Math.min(3,dist/md*3);
  mPL.setAttribute('cx',80+px);mPL.setAttribute('cy',62+py);
  mPR.setAttribute('cx',120+px);mPR.setAttribute('cy',62+py);

  const thr=(dx/md)*3;mhR+=(thr-mhR)*.025;mHd.style.transform=`rotate(${mhR}deg)`;
  const tbr=(dx/md)*1.2;mbR+=(tbr-mbR)*.018;mBd.style.transform=`rotate(${mbR}deg)`;
  const tlr=Math.sin(t*1.1)*1.8+(dx/md)*-2.5;mlR+=(tlr-mlR)*.02;mLa.style.transform=`rotate(${mlR}deg)`;
  const trr=Math.sin(t*1.1+.5)*1.8+(dx/md)*2.5;mrR+=(trr-mrR)*.02;mRa.style.transform=`rotate(${mrR}deg)`;
  requestAnimationFrame(tickMain);
}
requestAnimationFrame(tickMain);

// Baby — underwater elastic
const baby=document.getElementById('baby');
const bHd=document.getElementById('b-hd'),bBd=document.getElementById('b-bd');
const bLa=document.getElementById('b-la'),bRa=document.getElementById('b-ra');
const bPL=document.getElementById('b-pL'),bPR=document.getElementById('b-pR');
let bx=innerWidth/2+80,by=innerHeight/2,bvx=0,bvy=0;

function tickBaby(){
  const t=performance.now()/1000;
  const idle=performance.now()-lastMove>1500;
  const ar=ms.getBoundingClientRect();
  const agX=ar.left+ar.width/2,agY=ar.top+ar.height/2;
  let tx,ty;
  if(idle){tx=agX;ty=agY+5}else{tx=mx+50;ty=my-28}

  const dx=tx-bx,dy=ty-by,dist=Math.sqrt(dx*dx+dy*dy)||1;
  bvx+=dx*.002;bvy+=dy*.002;
  if(dist>130){const ex=dist-130;bvx+=(dx/dist)*ex*.006;bvy+=(dy/dist)*ex*.006}
  bvx*=.935;bvy*=.935;
  bvx+=Math.sin(t*.6)*.015;bvy+=Math.cos(t*.8)*.012;
  bx+=bvx;by+=bvy;

  const tilt=bvx*3,bob=Math.sin(t*1.6)*2.5;
  baby.style.left=bx+'px';baby.style.top=(by+bob)+'px';
  baby.style.transform=`translate(-50%,-50%) rotate(${tilt}deg)`;

  if(idle){const d2=Math.sqrt((bx-agX)**2+(by-agY)**2);baby.style.opacity=String(Math.max(0,Math.min(1,d2/50-.2)))}
  else{baby.style.opacity='1'}

  const bhr=Math.sin(t*1.3)*1.2+tilt*.2;
  bHd.style.transform=`rotate(${bhr}deg)`;
  bBd.style.transform=`rotate(${tilt*.1}deg)`;
  bLa.style.transform=`rotate(${Math.sin(t*1.6)*3+tilt*-.4}deg)`;
  bRa.style.transform=`rotate(${Math.sin(t*1.6+1)*3+tilt*.4}deg)`;

  const bdx=mx-bx,bdy=my-by,bd=Math.sqrt(bdx*bdx+bdy*bdy)||1;
  bPL.setAttribute('cx',80+(bdx/bd)*2.5);bPL.setAttribute('cy',62+(bdy/bd)*1.8);
  bPR.setAttribute('cx',120+(bdx/bd)*2.5);bPR.setAttribute('cy',62+(bdy/bd)*1.8);
  requestAnimationFrame(tickBaby);
}
setTimeout(()=>baby.classList.add('show'),600);
requestAnimationFrame(tickBaby);

function openPage(id){
  const d=P[id];if(!d)return;
  document.getElementById('landing').style.display='none';
  baby.style.display='none';
  document.getElementById('sub').classList.add('active');
  document.getElementById('pt').textContent=d.t;
  document.getElementById('pc').innerHTML=d.r();
  window.scrollTo(0,0);
  document.querySelectorAll('#sub .ec,#sub .si2,#sub .xc').forEach((e,i)=>{e.style.animationDelay=(i*.06)+'s'});
}
function goBack(){
  document.getElementById('sub').classList.remove('active');
  document.getElementById('landing').style.display='flex';
  baby.style.display='block';
}
addEventListener('load',placeLabels);
addEventListener('resize',placeLabels);
</script>
</body>
</html>
