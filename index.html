<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyungu Kim - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Sora:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-font: 'Sora', sans-serif;
            --header-font: 'Playfair Display', serif;
            --icon-color: #000000;
            --vibrant-aura: rgba(135, 206, 235, 0.4); /* Sky Blue with reduced opacity for subtle aura */
        }

        body {
            font-family: var(--primary-font);
            margin: 0;
            padding: 0;
            background-color: #f8f9fa; /* Very light gray */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* VIBRATING AURA CORE */
        .aura-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50vw; /* Focus around the agent */
            height: 50vw;
            border-radius: 50%;
            background: radial-gradient(circle, var(--vibrant-aura) 0%, rgba(255,255,255,0) 70%);
            filter: blur(50px);
            opacity: 0.6;
            animation: vibrateAura 4s infinite alternate, pulseOpacity 3s infinite alternate;
            z-index: 1; /* Behind other content but over the very background */
        }

        @keyframes vibrateAura {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-51%, -49%) scale(1.03); }
        }

        @keyframes pulseOpacity {
            0% { opacity: 0.5; }
            100% { opacity: 0.8; }
        }

        /* CONTENT CONTAINER */
        .content-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-areas:
                ". research misc ."
                "publications . . honors"
                "opensource . . projects"
                ". about . ."
                ". . . .";
            gap: 20px;
            padding: 50px;
            z-index: 10;
        }

        /* AGENT (Floating in the center of the grid) */
        .agent-container {
            grid-area: center; /* Dummy grid area for placement */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            z-index: 5;
            pointer-events: none; /* Let clicks pass through to icons */
        }

        .agent-body {
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%"><stop offset="0%" style="stop-color:rgb(255,255,255);stop-opacity:1" /><stop offset="100%" style="stop-color:rgb(240,240,240);stop-opacity:1" /></radialGradient><filter id="shine"><feGaussianBlur stdDeviation="0.8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g><circle cx="50" cy="40" r="30" fill="url(%23grad1)" /><rect x="35" y="65" width="30" height="25" rx="10" fill="url(%23grad1)" /><circle cx="50" cy="77.5" r="5" fill="%23b0e0e6" opacity="0.8" /></g><g transform="translate(30, 30)"><circle cx="10" cy="10" r="6" fill="%23007bff" filter="url(%23shine)" /><circle cx="30" cy="10" r="6" fill="%23007bff" filter="url(%23shine)" /><circle cx="10" cy="10" r="1.5" fill="white" /><circle cx="30" cy="10" r="1.5" fill="white" /></g></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* FLIGHT AGENT (Initially hidden, flies in on hover) */
        .flight-agent {
            position: absolute;
            width: 120px;
            height: 120px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.1);
            opacity: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="grad1_f" cx="50%" cy="50%" r="50%" fx="50%" fy="50%"><stop offset="0%" style="stop-color:rgb(255,255,255);stop-opacity:1" /><stop offset="100%" style="stop-color:rgb(240,240,240);stop-opacity:1" /></radialGradient></defs><g><circle cx="50" cy="40" r="30" fill="url(%23grad1_f)" /><rect x="35" y="65" width="30" height="25" rx="10" fill="url(%23grad1_f)" /></g><g transform="translate(30, 30)"><circle cx="10" cy="10" r="6" fill="%23007bff" /><circle cx="30" cy="10" r="6" fill="%23007bff" /></g></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s ease;
            pointer-events: none;
            z-index: 15;
        }

        /* TRAIL EFFECT */
        .trail-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 14;
        }

        /* DOTTED TRAIL EFFECT */
        .dotted-trail {
            position: absolute;
            border-radius: 50%;
            background-color: var(--vibrant-aura);
            opacity: 0;
            transition: transform 0.8s ease, opacity 0.6s ease;
        }

        /* NAVIGATION ITEM STYLES */
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-item:hover {
            color: var(--icon-color);
        }

        .nav-item:hover .flight-agent {
            transform: translate(-50%, -50%) scale(1) translateY(-20px) rotate(5deg);
            opacity: 1;
        }

        .nav-item:hover .trail-effect {
            opacity: 1;
        }

        .nav-item:hover .dotted-trail {
            opacity: 1;
        }

        .nav-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .nav-item:hover .nav-icon {
            opacity: 1;
        }

        .nav-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        /* ICON SVGs (Flat 2D Black) */
        .icon-publications { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h12v16H6V4zm2 3h8v2H8V7zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>'); }
        .icon-research { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>'); }
        .icon-misc { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>'); }
        .icon-honors { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/></svg>'); }
        .icon-projects { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>'); }
        .icon-about { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>'); }
        .icon-opensource { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="black"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>'); }

        /* HEADER TEXT (Bottom, Center) */
        .footer-header {
            position: absolute;
            bottom: 40px;
            text-align: center;
            width: 100%;
            z-index: 10;
        }

        .header-name {
            font-family: var(--header-font);
            font-size: 2.5rem;
            font-style: italic;
            font-weight: 400;
            color: #000;
            margin-bottom: 5px;
        }

        .subtitle {
            font-family: var(--header-font);
            font-size: 1rem;
            color: #666;
            margin-top: 0;
        }

        /* GRID POSITIONING */
        .item-research { grid-area: research; align-self: end; justify-self: center; }
        .item-misc { grid-area: misc; align-self: end; justify-self: center; }
        .item-publications { grid-area: publications; align-self: center; justify-self: end; }
        .item-honors { grid-area: honors; align-self: center; justify-self: start; }
        .item-opensource { grid-area: opensource; align-self: center; justify-self: end; }
        .item-projects { grid-area: projects; align-self: center; justify-self: start; }
        .item-about { grid-area: about; align-self: start; justify-self: center; }

        /* TRAIL DOT PLACEMENT (Individualized) */
        .trail-dot-1 { width: 6px; height: 6px; top: 10%; left: 30%; transform: scale(0); animation: trailDot 0.6s ease-out 0.1s forwards; }
        .trail-dot-2 { width: 8px; height: 8px; top: 40%; left: 15%; transform: scale(0); animation: trailDot 0.6s ease-out 0.2s forwards; }
        .trail-dot-3 { width: 5px; height: 5px; top: 70%; left: 40%; transform: scale(0); animation: trailDot 0.6s ease-out 0.3s forwards; }
        .trail-dot-4 { width: 7px; height: 7px; top: 20%; left: 75%; transform: scale(0); animation: trailDot 0.6s ease-out 0.4s forwards; }
        .trail-dot-5 { width: 6px; height: 6px; top: 60%; left: 85%; transform: scale(0); animation: trailDot 0.6s ease-out 0.5s forwards; }

        @keyframes trailDot {
            0% { transform: scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1) translateY(10px); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="aura-core"></div>

    <div class="content-container">
        
        <div class="agent-container">
            <div class="agent-body"></div>
        </div>

        <a href="#publications" class="nav-item item-publications">
            <div class="flight-agent"></div>
            <div class="trail-effect">
                <div class="dotted-trail trail-dot-1"></div>
                <div class="dotted-trail trail-dot-2"></div>
                <div class="dotted-trail trail-dot-3"></div>
            </div>
            <div class="nav-icon icon-publications"></div>
            <div class="nav-label">Publications</div>
        </a>

        <a href="#research" class="nav-item item-research">
            <div class="flight-agent"></div>
            <div class="trail-effect">
                <div class="dotted-trail trail-dot-2"></div>
                <div class="dotted-trail trail-dot-4"></div>
            </div>
            <div class="nav-icon icon-research"></div>
            <div class="nav-label">Research</div>
        </a>

        <a href="#misc" class="nav-item item-misc">
            <div class="flight-agent"></div>
            <div class="trail-effect">
                <div class="dotted-trail trail-dot-3"></div>
                <div class="dotted-trail trail-dot-5"></div>
            </div>
            <div class="nav-icon icon-misc"></div>
            <div class="nav-label">Misc</div>
        </a>

        <a href="#honors" class="nav-item item-honors">
            <div class="flight-agent"></div>
            <div class="trail-effect">
                <div class="dotted-trail trail-dot-1"></div>
                <div class="dotted-trail trail-dot-4"></div>
            </div>
            <div class="nav-icon icon-honors"></div>
            <div class="nav-label">Honors</div>
        </a>

        <a href="#projects" class="nav-item item-projects">
            <div class="flight-agent"></div>
            <div class="trail-effect">
                <div class="dotted-trail trail-dot-2"></div>
                <div class="dotted-trail trail-dot-3"></div>
                <div class="dotted-trail trail-dot-5"></div>
            </div>
            <div class="nav-icon icon-projects"></div>
            <div class="nav-label">Projects</div>
        </a>

        <a href="#about" class="nav-item item-about">
            <div class="flight-agent"></div>
            <div class="trail-effect">
                <div class="dotted-trail trail-dot-1"></div>
                <div class="dotted-trail trail-dot-4"></div>
            </div>
            <div class="nav-icon icon-about"></div>
            <div class="nav-label">About</div>
        </a>

        <a href="#opensource" class="nav-item item-opensource">
            <div class="flight-agent"></div>
            <div class="trail-effect">
                <div class="dotted-trail trail-dot-2"></div>
                <div class="dotted-trail trail-dot-5"></div>
            </div>
            <div class="nav-icon icon-opensource"></div>
            <div class="nav-label">Open Source</div>
        </a>

    </div>

    <div class="footer-header">
        <h1 class="header-name">Hyungu Kim</h1>
        <p class="subtitle">일 든</p>
    </div>

</body>
</html>
